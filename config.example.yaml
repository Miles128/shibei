# Shibei 配置

# === 数据存储 ===
storage:
  path: ~/.shibei/db          # 数据存储路径

# === 数据源 ===
sources:
  - ~/Documents/notes               # 扫描这些目录下的 *.md
  # - ~/Documents/articles

# === 分块 ===
chunking:
  max_chars: 800                    # 每块最大字符数
  split_pattern: "\n(?=## )"        # 按 ## 标题切分
  overlap: 0                        # 相邻 chunk 重叠字符数（0=不重叠，推荐 50-100）
  parent_window: 0                  # parent-child 模式：parent 包含 N 个 child（0=禁用，推荐 2-3）
  sentence_boundaries: "。！？!?\n"  # 句子边界字符（用于不切断词的切分）

# === 标签规则 ===
# 按顺序匹配，命中即停止。检查文件路径 + 内容前 500 字。
tagging:
  rules:
    - pattern: "(面试|复盘|interview)"
      tag: interview
    - pattern: "(AI|人工智能|大模型|机器学习)"
      tag: ai
    - pattern: "(金融|银行|风控|finance)"
      tag: finance
    - pattern: "(求职|job)"
      tag: job-search
    - pattern: "(日记|daily)"
      tag: daily-summary
    - pattern: ".*"
      tag: personal-note           # 兜底

# === 相关文档发现 ===
# 默认关闭以加速 shibei_context / shibei_search 召回。
# 宽标签（如 interview、personal-note）会导致标签 fanout 大、耗时上升。
related:
  enabled: false
  top_k: 1                       # 启用时只对前 N 条命中算关联
  limit: 3                       # 最多返回几条 related

# === 查询改写（口语 -> BM25 友好） ===
# 在 expander 之前执行，按顺序做关键词替换。
rewriter:
  enabled: false                   # 默认关闭（规则兜底）
  # 口语→关键词扩写：默认由宿主 Agent 用自己的 LLM 完成，再调 shibei_context/search。
  # use_llm 仅给纯 CLI / 无人值守；开启需 SHIBEI_LLM_API_KEY。
  use_llm: false
  max_terms: 8                     # 服务端 LLM 改写最多输出词数
  rules:
    - from: "讲讲"                # 口语关键词
      to: "介绍"                  # 改写后的关键词
      enabled: true
    - from: "怎么看"
      to: "分析"
      enabled: true

# === 查询扩展（零向量库） ===
# 通过外部同义词表 + 编辑距离模糊匹配，提升 BM25 召回。
# 同义词表示例：
#   {
#     "手机": ["移动电话", "手提电话"],
#     "AI": ["人工智能", "大模型"]
#   }
expander:
  enabled: false                   # 默认关闭
  synonyms_path: ""                # YAML/JSON 同义词表路径
  fuzzy: false                     # 是否启用编辑距离兜底
  fuzzy_max_distance: 1            # 最大编辑距离
  fuzzy_max_candidates: 3          # 每个词最多返回几个模糊候选
  min_query_len: 2                 # 参与扩展的最小词长

# === LLM 摘要（可选） ===
# 导入时为每个 chunk 生成一句话中文摘要，API key 通过 SHIBEI_LLM_API_KEY 环境变量读取。
# 摘要失败时自动降级为空字符串，不会阻断导入。
llm:
  enabled: false
  preset: custom                   # deepseek | openai | ollama | custom（custom 用下面的 base_url/model）
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  timeout: 30.0
  temperature: 0.3
  max_tokens: 100
  max_content_length: 1000         # 输入 chunk 最大字符数（0=不限制）
  max_summary_length: 50           # 期望摘要最大字数
  prompt: ""                       # 自定义 prompt 模板（留空使用默认）

# === 轻量向量混合检索（可选，默认关） ===
# 开启后导入时为 chunk 生成向量，搜索用 BM25 + 向量三路 RRF 融合（对标 TencentDB hybrid）。
# 两个后端：
#   - api:   OpenAI-compatible /embeddings 接口（key 走 SHIBEI_LLM_API_KEY）
#   - local: 可选依赖 fastembed（本地 ONNX，需 pip install fastembed）
# 任一不可用自动降级纯 BM25，不阻断导入/搜索。
vector:
  enabled: false
  provider: api                    # "api" | "local"
  model: "BAAI/bge-small-zh-v1.5"  # 本地模型名或 API 侧 embedding 模型名
  dim: 512                         # 向量维度（bge-small-zh-v1.5 = 512）
  batch_size: 16                   # 批量 embedding 大小
  min_score: 0.5                   # 余弦相似度下限；低于此值不参与融合
  add_new_rows: false              # false=向量只重排 BM25 已命中项，避免零命中时返回纯向量噪声

# === MCP 响应上下文卸载（对标 TencentDB 短期上下文治理） ===
# shibei_context / shibei_search 结果超过 max_bytes 时，完整 JSON 写入
# <db_path>/offload/<id>.json，响应只回摘要 + 引用路径，省上下文 Token。
offload:
  enabled: true
  max_bytes: 8000                  # 超过此字节数即卸载
  keep_summary_text: 120           # 卸载时每个文本字段保留的字符数

# === 自动记忆抽取（可选，默认关，对标 TencentDB L0→L1 自动流水线） ===
# 开启且设置 SHIBEI_LLM_API_KEY 时，shibei_context 检测到第一人称披露
# 的新事实会自动写入记忆，无需宿主手动调 remember。
auto_memory:
  enabled: false
  category: user                   # 自动写入的记忆分类
  source: auto                     # 来源标记
  max_facts: 3
  dedup: true
  dedup_candidates: 5                     # 单次最多抽取条数
  min_priority: 0                  # 低于该优先级的记忆丢弃（instruction 的 -1 除外）
# === Cross-encoder 重排（可选，默认关） ===
# 初筛 BM25/向量 top_k 后用本地 cross-encoder 重新打分，压掉关键词命中但不相关的噪声。
# 依赖 fastembed；模型首次使用会从 HuggingFace 下载（国内可设 HF_ENDPOINT=https://hf-mirror.com）。
rerank:
  enabled: false
  model: "BAAI/bge-reranker-base"
  top_k: 20
  batch_size: 8
