[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shibei"
version = "0.1.0"
description = "中文语义知识库 — BM25 + MCP，给 AI Agent 用的外部大脑"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["bm25", "mcp", "knowledge-base", "rag", "search", "chinese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
shibei = "shibei.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio", "mypy>=1.0"]
docx = ["python-docx>=1.0"]
xlsx = ["openpyxl>=3.1"]
jieba = ["jieba>=0.42"]
all = ["python-docx>=1.0", "openpyxl>=3.1", "jieba>=0.42"]

[tool.setuptools.packages.find]
where = ["src"]
